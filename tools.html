  <div class="container nav">
    <a class="brand" href="index.html"><span class="brand-mark">WK</span><span>MUMING WorkKit<small>牧茗產業工具平台</small></span></a>
    <button class="menu-toggle" data-menu-toggle aria-label="開啟選單" aria-expanded="false"><span></span><span></span><span></span></button>

<main id="main" data-tool-explorer>
  <section class="wk-tools-hero">
    <div class="container">
      <div class="wk-tools-title">
        <div><p class="eyebrow">Tool search</p><h1>探索工具</h1><p>先搜尋，再用功能與產業縮小範圍。</p></div>
        <p class="wk-tool-count">目前共有 <strong data-tool-count>0</strong> 個工具</p>
      </div>
      <div class="search-box wk-tools-search">
        <form class="search-form" onsubmit="return false;">
          <input data-tool-search type="search" placeholder="今天想解決什麼工作？" aria-label="搜尋工具">
          <button class="button button-secondary" type="button">搜尋</button>
        </form>
        <div class="search-hints" aria-label="熱門搜尋關鍵字">
          <button class="chip" data-search-chip type="button">報價</button>
          <button class="chip" data-search-chip type="button">催件</button>
          <button class="chip" data-search-chip type="button">日期</button>
          <button class="chip" data-search-chip type="button">費用</button>
          <button class="chip" data-search-chip type="button">多語</button>
          <button class="chip" data-search-chip type="button">流程</button>
        </div>
      </div>
    </div>
  </section>

  <section class="wk-tool-browser">
    <div class="container">
      <div class="wk-filter-group">
        <div class="wk-filter-label"><strong>功能分類</strong><span>先選工作類型</span></div>
        <div class="tool-tabs wk-function-tabs" aria-label="主要功能分類">
          <button class="is-active" type="button" data-tool-category="全部工具">全部工具</button>
          <button type="button" data-tool-category="寫訊息">寫訊息</button>
          <button type="button" data-tool-category="計算試算">計算試算</button>
          <button type="button" data-tool-category="文件表單">文件表單</button>
          <button type="button" data-tool-category="清單流程">清單流程</button>
          <button type="button" data-tool-category="多語溝通">多語溝通</button>
        </div>
      </div>
      <div class="wk-filter-strip">
        <label>產業
          <select class="control" data-tool-industry>
            <option>全部產業</option>
            <option>行政人資</option>
            <option>工程職人</option>
            <option>外籍人力</option>
            <option>工廠管理</option>
            <option>顧問業務</option>
          </select>
        </label>
        <label>狀態
          <select class="control" data-tool-status aria-label="狀態篩選">
            <option>全部狀態</option>
            <option>免費</option>
            <option>正式可用</option>
            <option>測試版</option>
            <option>開發中</option>
          </select>
        </label>
        <label>排序
          <select class="control" data-tool-sort aria-label="排序">
            <option value="recommended">推薦</option>
            <option value="popular">熱門</option>
            <option value="latest">最新</option>
            <option value="name">名稱</option>
          </select>
        </label>
        <span class="result-note">顯示 <strong data-result-count>0</strong> 個工具</span>
      </div>
      <div class="wk-tool-grid" data-tool-list></div>
      <div class="empty-state" data-empty-state hidden>
        <h2>找不到符合條件的工具</h2>
        <p>可以換個關鍵字，或透過意見回饋告訴我們你需要的工作情境。</p>
      </div>
    </div>
  </section>
</main>
